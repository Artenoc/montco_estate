<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Montco Estate Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1 class="logo">Montco Estate</h1>
  </header>

<div class="container">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="montco_estate.html" class="current">Montco Macro</a></li>
        <li><a href="solarmonitor.html">Solar Power Monitor</a></li>
        <li><a href="PVChar.html">PV Characterization</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>


    <div class="stats-grid" style="display: flex; gap: 1.5rem; margin: 1.5rem 0;">
      <div class="stat-card" style="padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; flex: 1;">
        <span style="font-size: 0.85rem; color: #64748b; text-transform: uppercase;">Latest 30Y Mortgage</span>
        <div style="font-size: 1.5rem; font-weight: bold; color: #dc2626;" id="latestMortgage">--%</div>
      </div>
      <div class="stat-card" style="padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; flex: 1;">
        <span style="font-size: 0.85rem; color: #64748b; text-transform: uppercase;">Latest Philly CPI</span>
        <div style="font-size: 1.5rem; font-weight: bold; color: #2563eb;" id="latestCPI">--</div>
      </div>
      <div class="stat-card" style="padding: 1rem; border: 1px solid #e2e8f0; border-radius: 8px; flex: 1;">
        <span style="font-size: 0.85rem; color: #64748b; text-transform: uppercase;">Latest Update</span>
        <div style="font-size: 1.5rem; font-weight: bold; color: #1e293b;" id="latestDate">--</div>
      </div>
    </div>

    <!-- Chart Controls -->
    <div class="controls-panel" style="margin: 1rem 0; display: flex; align-items: center; gap: 1.5rem;">
      <label style="cursor: pointer; display: flex; align-items: center; gap: 0.4rem;">
        <input type="checkbox" id="showMortgage" checked /> 
        <span style="color: #dc2626; font-weight: 600;">30-Year Mortgage Rate (%)</span>
      </label>
      <label style="cursor: pointer; display: flex; align-items: center; gap: 0.4rem;">
        <input type="checkbox" id="showCPI" checked /> 
        <span style="color: #2563eb; font-weight: 600;">Philly CPI (Index)</span>
      </label>
    </div>


    <div class="chart-container" style="position: relative; width: 100%; min-height: 420px;">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <footer></footer>

  <script>
    const ctx = document.getElementById('mainChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: '30-Year Fixed Mortgate Rate (%)',
            data: [],
            borderColor: '#dc2626',
            backgroundColor: 'rgba(220, 38, 38, 0.08)',
            yAxisID: 'yMortgage',
            fill: true,
            tension: 0.2,
            pointRadius: 2,
            borderWidth: 2
          },
          {
            label: 'Philadelphia Area CPI',
            data: [],
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.08)',
            yAxisID: 'yCPI',
            fill: true,
            tension: 0.2,
            pointRadius: 2,
            pointWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interation{
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {display: false}
        },
        scales: {
          x: {
            title: { display: true, text: 'Date (Year-Month' },
            grid : { color: '#f1f59' }
          },
          yMortgage: {
            type: 'linear',
            position: 'left',
            title: { display: true, text: 'Mortgage Rate (%)' },
            beginAtZero: false,
            grid: { color: '#f1f59' }
          },
          yCPI: {
            type: 'linear',
            position: 'right',
            title: { display: true, text: 'CPI' },
            beginAtZero: false,
            grid: { drawOnChartArea: false }
          }
        }
      }
    });

    async function fetchMacroData() {
      try {

        const reponse = await fetch('get_macro_data.php');
        if (!response.ok) {
          throw new Error('HTTP Error: ${response.status}');
        }

        const data = await response.json();
        if (data.error) {
          console.error("Database query failed:", data.error);
          return;
        }

        chart.data.labels = data.dates;
        chart.data.datasets[0].data = data.mortgage_rates;
        chart.data.datasets[1].data = data.cpi;
        chart.update();

        const lastIndex = data.dates.length - 1
        if (lastIndex >= 0) {
          const latestM = data.mortgage_rates[lastIndex];
          const latestC = data.cpi[lastIndex];

          document.getElementById('latestDate').textContent = data.dates[lastIndex];
          document.getElementById('latestMortgage').textContext = latestM !== null ? '${latestM.toFixed(2)}%' : 'N/A';
          document.getElementById('latestCPI').textContext = latestC !== null ? latestC.toFixed(1) : 'N/A';

        }
      } catch (err) {
        console.error("Error fetching macro data:", err);
      }
    }

    document.getElementById('showMortgage').addEventListener('change', e => {
      chart.data.datasets[0].hidden = !e.target.checked;
      chart.options.scales.yMortgage.display = e.target.checked;
      chart.updates();
    });

    document.getElementById('showCPI').addEventListener('change', e => {
      chart.data.datasets[0].hidden = !e.target.checked;
      chart.options.scales.yMCPI.display = e.target.checked;
      chart.updates();
    });

    document.addEventListener("DOMContentLoaded", fetchMacroData);
        
  </script>
</body>
</html>
