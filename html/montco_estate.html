<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Montco Estate</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1 class="logo">Montco Estate</h1>
  </header>

  <div class="container">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="solarmonitor.html" class="current">Solar Power Monitor</a></li>
        <li><a href="PVChar.html">PV Characterization</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

        <label style="margin-left:2em;">
        <label><input type="checkbox" id="showMortgage" checked /> Mortgage Rates</label>
        <label><input type="checkbox" id="showCPI" checked /> CPI</label>
      </div>

    <canvas id="mainChart"></canvas>
  </div>

  <footer></footer>

  <script>
    const ctx = document.getElementById('mainChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Mortgate Data',
            data: [],
            borderColor: 'red',
            yAxisID: 'y',
            fill: false,
            tension: 0.1
          },
          {
            label: 'Consumer Price Index',
            data: [],
            borderColor: 'blue',
            yAxisID: 'y1',
            fill: false,
            tension: 0.1
          }
        ]
      },
      options: {
        scales: {
          x: {
            title: { display: true, text: 'Time' }
          },
          y: {
            type: 'linear',
            position: 'left',
            title: { display: true, text: 'Mortgage Rates' },
            beginAtZero: true
          },
          y1: {
            type: 'linear',
            position: 'right',
            title: { display: true, text: 'CPI' },
            beginAtZero: true,
            grid: { drawOnChartArea: false }
          }
        }
      }
    });

    function formatLocalTimestamp(date) {
      const pad = n => n.toString().padStart(2, '0');
      return date.getFullYear()
        + '-' + pad(date.getMonth() + 1)
        + '-' + pad(date.getDate())
        + ' ' + pad(date.getHours())
        + ':' + pad(date.getMinutes())
        + ':' + pad(date.getSeconds());
    }

    async function fetchData() {
      const selectedValue = document.getElementById("timeRange").value;
      let sinceTimestamp;
      let url = "smartdata.php?";
    
      if (selectedValue === "custom") {
        const dateStr = document.getElementById("customDate").value;
        const hourStart = parseInt(document.getElementById("customHourStart").value, 10);
        const hourEnd = parseInt(document.getElementById("customHourEnd").value, 10);
    
        if (!dateStr || isNaN(hourStart) || isNaN(hourEnd) || hourEnd < hourStart) {
          alert("Please enter a valid custom time range.");
          return;
        }
    
        // Parse the date properly
        const [year, month, day] = dateStr.split("-");
        const startDate = new Date(year, month - 1, day, hourStart);
    
        // Build proper `since` string and `date` for the filename
        sinceTimestamp = formatLocalTimestamp(startDate);
        const dateParam = `${parseInt(month)}_${parseInt(day)}_${year}`;
    
        const endDate = new Date(year, month - 1, day, hourEnd);
        const endTimestamp = formatLocalTimestamp(endDate);
        url += `since=${encodeURIComponent(sinceTimestamp)}&end=${encodeURIComponent(endTimestamp)}&date=${encodeURIComponent(dateParam)}`;
      } else {
        const rangeMs = parseInt(selectedValue, 10);
        const sinceDate = new Date(Date.now() - rangeMs);
        sinceTimestamp = formatLocalTimestamp(sinceDate);
        url += `since=${encodeURIComponent(sinceTimestamp)}`;
      }
    
      try {
        const response = await fetch(url);
        const newData = await response.json();
        if (!newData.length) {
          console.log("No data returned for", url);
          return;
        }
    
        newData.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        chart.data.labels = newData.map(e => e.timestamp);
        chart.data.datasets[0].data = newData.map(e => e.voltage);
        chart.data.datasets[1].data = newData.map(e => e.current);
        chart.data.datasets[2].data = newData.map(e => e.power);
        chart.update();
    
        const last = newData[newData.length - 1];
        document.getElementById('currentVoltage').textContent = last.voltage.toFixed(3);
        document.getElementById('currentCurrent').textContent = last.current.toFixed(3);
        document.getElementById('currentPower').textContent = last.power.toFixed(3);
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }


    // Initial fetch
    fetchData();
    setInterval(() => {
      if (document.getElementById("timeRange").value !== "custom") fetchData();
    }, 5000);

    // Toggle custom controls visibility
    document.getElementById('timeRange').addEventListener('change', e => {
      const isCustom = e.target.value === "custom";
      document.getElementById('customTimeControls').style.display = isCustom ? 'block' : 'none';
      if (!isCustom) fetchData();
    });

    // Toggle visibility of each data line
    document.getElementById('showVoltage').addEventListener('change', e => {
      chart.data.datasets[0].hidden = !e.target.checked;
      chart.update();
    });
    document.getElementById('showCurrent').addEventListener('change', e => {
      chart.data.datasets[1].hidden = !e.target.checked;
      chart.update();
    });
    document.getElementById('showPower').addEventListener('change', e => {
      chart.data.datasets[2].hidden = !e.target.checked;
      chart.update();
    });
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("customDate").value = today;
    });

  </script>
</body>
</html>
