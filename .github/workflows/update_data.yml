name: Weekly Montco Real Estate Data Update

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-macro-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with: 
          python-version: '3.13'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fredapi pandas numpy-financial python-dotenv

      - name: Run extraction and generate montco_macro.db
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/etl.py

      - name: Commit and push updated SQLite database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add montco_macro.db
          # Only commit if the database file actually changed
          git commit -m "Automated update of montco_macro.db" || echo "No changes to commit"
          git push

      - name: Deploy Data to deryk.mcgarry.io via SFTP
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e scp -P 65002 -o StrictHostKeyChecking=no \
            montco_macro.db \
            "$SSH_USER@$SSH_HOST:domains/mcgarry.io/public_html/deryk/data/montco_estate/"

          sshpass -e scp -P 65002 -o StrictHostKeyChecking=no \
           api/get_macro_data.php \
            "$SSH_USER@$SSH_HOST:domains/mcgarry.io/public_html/deryk/api/"

          sshpass -e scp -P 65002 -o StrictHostKeyChecking=no \
            html/montco_estate.html \
            "$SSH_USER@$SSH_HOST:domains/mcgarry.io/public_html/deryk/"
          
          
