name: Weekly Montco Real Estate Data Update

on:
  schedule:
    - cron: '0 12 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-macro-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with: 
          python-version: '3.13'
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fredapi pandas numpy-financial python-dotenv

      - name: Run extraction and generate montco_macro.db
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/etl.py

      - name: Commit and push updated SQLite database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add montco_macro.db
          # Only commit if the database file actually changed
          git commit -m "Automated update of montco_macro.db" || echo "No changes to commit"
          git push

      - name: Deploy Data to deryk.mcgarry.io via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 65002
          source: "montco_macro.db,duplex_data.php"
          target: "/home/u172459591/domains/mcgarry.io/public_html/deryk/data/montco_estate"
          
          
          
