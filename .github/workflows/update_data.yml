name: Weekly Montco Real Estate Data Update

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-macro-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with: 
          python-version: '3.13'
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fredapi pandas numpy-financial

      - name: Run extraction and generate montco_macro.db
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python etl.py

      - name: Commit and push updated SQLite database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add montco_macro.db
          # Only commit if the database file actually changed
          git commit -m "Automated update of montco_macro.db" || echo "No changes to commit"
          git push
          
