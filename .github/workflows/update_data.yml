name: Weekly Montco Real Estate Data Update

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-macro-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with: 
          python-version: '3.13'
  
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fredapi pandas numpy-financial python-dotenv

      - name: Run extraction and generate montco_macro.db
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/etl.py

      - name: Commit and push updated SQLite database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add montco_macro.db
          # Only commit if the database file actually changed
          git commit -m "Automated update of montco_macro.db" || echo "No changes to commit"
          git push

      - name: Deploy Data to deryk.mcgarry.io via SFTP
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          #sudo apt-get update && sudo apt-get install -y sshpass 
          TARGET_DIR=$(sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" '
          if [ -d "public_html/deryk" ]; then
            mkdir -p public_html/deryk/data/montco_estate
            echo "public_html/deryk/data/montco_estate"
          elif [ -d "domains/mcgarry.io/public_html/deryk" ]; then
            mkdir -p domains/mcgarry.io/public_html/deryk/data/montco_estate
            echo "domains/mcgarry.io/public_html/deryk/data/montco_estate"
          elif [ -d "domains/deryk.mcgarry.io/public_html" ]; then
              mkdir -p domains/deryk.mcgarry.io/public_html/data/montco_estate
              echo "domains/deryk.mcgarry.io/public_html/data/montco_estate"
            else
              echo "NOT_FOUND"
            fi
          ')
          if [ "$TARGET_DIR" = "NOT_FOUND" ]; then
            echo "Could not auto-detect folder. Here is the server directory layout:"
            sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "pwd && ls -la && ls -la domains/ 2>/dev/null || true"
            exit 1
          fi

          echo "Found target directory: $TARGET_DIR"

          sshpass -e scp -P 65002 -o StrictHostKeyChecking=no montco_macro.db duplex_data.php "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

          echo "Deployment Complete! Files in $TARGET_DIR"
          sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "ls -lh $TARGET_DIR"
          
          
